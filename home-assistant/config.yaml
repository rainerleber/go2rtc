# https://developers.home-assistant.io/docs/apps/configuration
name: go2rtc
version: "2026.10.32"
slug: go2rtc_chainguard
description: Local camera media backend with H.264/AAC, MPEG-TS HLS and snapshots
url: "https://github.com/rainerleber/go2rtc/tree/master/home-assistant"
arch:
  - amd64
  - aarch64
init: false
startup: application
host_network: true
map:
  - type: addon_config
    read_only: false
options:
  camera_address: ""
  camera_port: 554
  camera_path: ""
  camera_username: ""
  camera_password: ""
  # Supervisor merges defaults into existing options on upgrade. Empty values
  # let the generator preserve legacy paths/names or choose generic new names.
  source_name: ""
  output_name: ""
  output_mode: h264_aac
  preload: true
  video_width: 1280
  video_height: 720
  video_fps: 15
  keyframe_seconds: 1
  video_bitrate_kbps: 1500
  hls_segment_seconds: 1
  hls_segment_count: 6
schema:
  camera_address: str
  camera_username: str
  camera_password: password
  camera_port: int(1,65535)?
  camera_path: str?
  source_name: str?
  output_name: str?
  output_mode: list(h264_aac|passthrough)?
  preload: bool?
  video_width: int(160,1920)?
  video_height: int(120,1080)?
  video_fps: int(1,30)?
  keyframe_seconds: int(1,5)?
  video_bitrate_kbps: int(128,8000)?
  hls_segment_seconds: int(1,3)?
  hls_segment_count: int(3,10)?
  # Retained only for automatic migration of existing installations.
  camera_stream: list(main|sub|ext)?
image: "ghcr.io/rainerleber/go2rtc-chainguard"
