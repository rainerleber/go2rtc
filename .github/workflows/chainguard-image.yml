name: Container image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/chainguard-image.yml"
      - ".github/workflows/local-hls-camera.yml"
      - "docker/Dockerfile"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "home-assistant/**"
      - "custom_components/local_hls_camera/**"
      - "tests/local_hls_camera/**"
      - "requirements-extension-test.txt"
      - "pyproject.toml"
      - "hacs.json"
      - "scripts/**"
      - "testdata/hassaddon/**"

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_BUILDER_IMAGE: cgr.dev/chainguard/go:latest
  RUNTIME_IMAGE: cgr.dev/chainguard/wolfi-base:latest
  REGISTRY_IMAGE: ghcr.io/rainerleber/go2rtc-chainguard

jobs:
  integration:
    name: Test Home Assistant integration
    uses: ./.github/workflows/local-hls-camera.yml

  validate:
    name: Verify bases, build, and test
    runs-on: ubuntu-latest
    outputs:
      go_builder: ${{ steps.bases.outputs.go_builder }}
      runtime: ${{ steps.bases.outputs.runtime }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up upstream Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Run complete Go test suite
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Run Go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Race-test private media lifecycle and buffers
        run: go test -race ./internal/hls ./internal/hassaddon

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve and verify base images
        id: bases
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            local image="$1"
            local digest
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test -n "$digest"
            printf '%s@%s' "$image" "$digest"
          }

          go_builder="$(resolve "$GO_BUILDER_IMAGE")"
          runtime="$(resolve "$RUNTIME_IMAGE")"

          verify() {
            cosign verify \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
              "$1"
          }

          verify "$go_builder"
          verify "$runtime"

          echo "go_builder=$go_builder" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - name: Calculate immutable app version
        id: version
        shell: bash
        # CalVer: calendar year, month, and a monotonically increasing build.
        run: echo "version=$(date -u +'%Y.%m').${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build amd64 validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: go2rtc:test
          build-args: |
            GO_BUILDER_IMAGE=${{ steps.bases.outputs.go_builder }}
            RUNTIME_IMAGE=${{ steps.bases.outputs.runtime }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=go2rtc-amd64
          cache-to: type=gha,mode=max,scope=go2rtc-amd64

      - name: Test runtime and required codecs
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm go2rtc:test -version
          docker run --rm --entrypoint /usr/bin/ffmpeg go2rtc:test -hide_banner -version
          encoders="$(docker run --rm --entrypoint /usr/bin/ffmpeg go2rtc:test -hide_banner -encoders 2>/dev/null)"
          grep -Eq 'libx264' <<< "$encoders"
          grep -Eq ' aac ' <<< "$encoders"
          docker run --rm --entrypoint /usr/bin/ffmpeg go2rtc:test \
            -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=320x240:rate=1 \
            -frames:v 1 -vf scale=960:720,pad=1280:720:160:0:black \
            -c:v libx264 -f null -
          docker run --rm --entrypoint /usr/bin/ffmpeg go2rtc:test \
            -hide_banner -loglevel error \
            -f lavfi -i anullsrc=channel_layout=mono:sample_rate=16000 \
            -t 0.1 -c:a aac -f null -

      - name: Test generated app pipeline and offline-start recovery
        shell: bash
        run: |
          # Synthetic fixtures contain no real camera credentials. Preserve
          # diagnostics in the public summary even when a test fails.
          bash scripts/test-app-runtime.sh go2rtc:test >app-runtime.log 2>&1 && result=0 || result=$?
          cat app-runtime.log
          {
            echo '### Generated app runtime test'
            echo '```text'
            tail -100 app-runtime.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( result != 0 )); then
            diagnostic="$(tail -8 app-runtime.log)"
            diagnostic="${diagnostic//%/%25}"
            diagnostic="${diagnostic//$'\r'/%0D}"
            diagnostic="${diagnostic//$'\n'/%0A}"
            echo "::error title=Generated app media validation::$diagnostic"
          fi
          exit "$result"

  publish:
    name: Publish signed multi-architecture image
    needs: [validate, integration]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.REGISTRY_IMAGE }}:latest
          build-args: |
            GO_BUILDER_IMAGE=${{ needs.validate.outputs.go_builder }}
            RUNTIME_IMAGE=${{ needs.validate.outputs.runtime }}
            BUILD_VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=go2rtc-multiarch
          cache-to: type=gha,mode=max,scope=go2rtc-multiarch

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_IMAGE}@${DIGEST}"

      - name: Publish build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish matching App and HACS release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_version.py "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-assistant/config.yaml custom_components/local_hls_camera/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish ${VERSION} [skip ci]"
          fi
          # Fail closed if master advanced: never tag newer, untested code.
          # This tag records the exact tested source plus its version stamp.
          git push origin HEAD:master
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --latest --generate-notes \
            --notes "Unified go2rtc App and Local HLS Camera release ${VERSION}. The App image and integration manifest share this CalVer version. The signed multi-architecture image is ${REGISTRY_IMAGE}:${VERSION}. Integration branding is bundled locally. Update the App through the App store first, then the integration through HACS. CI does not deploy to or restart Home Assistant; follow the integration guide for activation and migration requirements."
